name: ios-kit-hang-debug
on:
  pull_request:
    paths:
    - mobile/**
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Bundle and validate iOS resources
      run: python3 mobile/ios/scripts/test_resources.py
    - name: VoiceStudioKit tests
      working-directory: mobile/ios/VoiceStudioKit
      run: swift test --no-parallel --verbose 2>&1 | tee "$RUNNER_TEMP/kit.log"
      timeout-minutes: 12
